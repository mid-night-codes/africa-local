    country: TZ
    category: mobile-money
    status: experimental
    path: providers/tanzania/mpesa

  - id: tz-airtel-money
    country: TZ
    category: mobile-money
    status: experimental
    path: providers/tanzania/airtel-money

  - id: ke-mpesa
    country: KE
    category: mobile-money
    status: experimental
    path: providers/kenya/mpesa

  - id: ug-mtn-momo
    country: UG
    category: mobile-money
    status: planned
    path: null
