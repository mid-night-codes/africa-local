# Africa Local provider registry (§9). Machine-readable source of truth for which providers
# exist and how mature they are. The CLI, the (future) desktop UI, and CI's
# scripts/validate-registry.js all read this file - do not duplicate this list anywhere else.
#
# status values: planned | experimental | beta | stable | deprecated

providers:
